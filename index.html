<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTE · Floor map</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f6;--card:#fff;--tx:#161616;--mut:#777;--ac:#1c1c1c;--acx:#fff;--ln:#d2d2d2;--floor:#eeeeee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1c1c;--tx:#f2f2f2;--mut:#9a9a9a;--ac:#f2f2f2;--acx:#111;--ln:#3a3a3a;--floor:#181818}}
:root[data-theme="dark"]{--bg:#111;--card:#1c1c1c;--tx:#f2f2f2;--mut:#9a9a9a;--ac:#f2f2f2;--acx:#111;--ln:#3a3a3a;--floor:#181818}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Prompt,system-ui,"Noto Sans Thai",sans-serif;min-height:100vh}
header{padding:18px 16px 8px;max-width:960px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0;font-weight:600;letter-spacing:.5px}
h1 span{color:var(--ac)}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.lang{display:flex;border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.lang button{border:0;background:none;color:var(--mut);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:var(--ac);color:var(--acx)}
.search{margin:14px 0 4px;position:relative}
.search input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--ac)}
main{max-width:960px;margin:auto;padding:0 16px 120px}
.mapwrap{background:var(--floor);border:1px solid var(--ln);border-radius:18px;overflow-x:auto;margin-top:10px}
svg{display:block;min-width:720px;width:100%;height:auto}
.b rect{fill:var(--card);stroke:var(--ln);stroke-width:1.2;transition:.15s}
.b.off{opacity:.45;cursor:default}
.b text{fill:var(--tx);font-size:9px;pointer-events:none;text-anchor:middle}
.b .id{font-size:9px;font-weight:600;fill:var(--mut)}
.b{cursor:pointer}
.b:hover rect{stroke-width:2.4}
.dim{opacity:.22}
.hit rect{fill:var(--ac);stroke:var(--ac);stroke-width:2}.hit text,.hit .id{fill:var(--acx)}
.lbl{fill:var(--mut);font-size:11px;font-weight:500;text-anchor:middle}
.hint{font-size:12px;color:var(--mut);margin:8px 2px}
h2{font-size:15px;margin:22px 2px 8px;font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.item{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.dot{width:10px;height:36px;border-radius:5px;background:var(--ac);flex:none}
.item b{font-weight:500;font-size:14px;display:block}
.item small{color:var(--mut);font-size:12px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s;max-height:78vh;overflow:auto;max-width:640px;margin:auto}
.sheet.open{transform:none}
.sheet h3{margin:0 0 6px;font-size:20px;font-weight:600}
.chips span{display:inline-block;background:var(--floor);color:var(--tx);font-size:12px;padding:3px 10px;border-radius:12px;margin:0 6px 6px 0;font-weight:500}
.close{position:absolute;right:14px;top:12px;border:0;background:var(--floor);color:var(--tx);width:32px;height:32px;border-radius:16px;font-size:16px;cursor:pointer}
.photos{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.photos div{flex:none;width:150px;height:110px;border-radius:12px;background:var(--floor);border:1px solid var(--ln);display:grid;place-items:center;color:var(--mut);font-size:26px;font-weight:600}
.desc{font-size:14px;line-height:1.6;color:var(--mut)}
.empty{color:var(--mut);font-size:14px;padding:6px 2px}
.zones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.zones button{border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:13px;padding:7px 14px;border-radius:18px;cursor:pointer}.zones button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}.lbl2{fill:var(--mut);font-size:11px;font-weight:600}
.zoom{display:none;gap:6px;justify-content:flex-end;margin-top:10px}.zoom button{width:34px;height:34px;border-radius:17px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
</style>
</head>
